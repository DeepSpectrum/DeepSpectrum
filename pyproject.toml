[tool.poetry]
name = "deepspectrum"
version = "0.6.9"
description = "DeepSpectrum is a Python toolkit for feature extraction from audio data with pre-trained Image Convolutional Neural Networks (CNNs)."
authors = ["Maurice Gerczuk <maurice.gerczuk@tum.de>"]
license = "GPLv3+"
readme = "README.md"
homepage = "https://github.com/DeepSpectrum/DeepSpectrum/"
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: GPU :: NVIDIA CUDA :: 12.0',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
    'Programming Language :: Python :: 3',
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
matplotlib = "^3.5.0"
librosa = "^0.10.0"
click = "^8.0.0"
pillow = "^10.0.0"
tensorflow = "^2.0.0"
opencv-python = "^4.8.0.0"
numba = "^0.59,<0.60"
torch = "^2.0.0"
torchvision = "^0.12.0"
gast = ">=0.5.0,<0.6.0"
rich = "^12.0.0"
rich-click = "*"


[tool.poetry.scripts]
deepspectrum = "deepspectrum.__main__:cli"


[tool.poetry.group.dev.dependencies]
ruff = "0.6.1"
bump-my-version = "^0.26.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.2"
coveralls = "^4.0.1"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
addopts = "-s --cov=<project-name> --cov-report xml:cov.xml"


[tool.coverage.run]
source = ["deepspectrum"]
parallel = true
concurrency = ["multiprocessing"]
branch = true
sigterm = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
